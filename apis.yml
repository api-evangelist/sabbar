name: Sabbar
description: Sabbar is a leading local employment and recruitment platform in Saudi Arabia
  that connects job seekers with employers across many sectors. Job seekers search
  listings, build a free CV, and apply to roles, while employers use subscription-based
  recruitment packages and candidate matching. The platform reports more than 12,000
  companies and over 1 million Saudi and non-Saudi job seekers, with iOS and Android
  mobile apps. It was surfaced as a portfolio company of 500 Global and added to the
  API Evangelist network. No public developer API surface was found during enrichment.
